<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页智能分析助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- 头部 + 标签切换 -->
    <header class="header">
      <h1>网页智能分析助手</h1>
      <div class="header-actions">
        <button id="openSidePanel" class="icon-btn" title="在侧边栏中打开">📌</button>
        <button id="toggleSettings" class="icon-btn" title="设置">⚙️</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="main">操作</button>
      <button class="tab" data-tab="memo">📝 备忘录</button>
      <button class="tab" data-tab="history">历史</button>
    </nav>

    <!-- 操作面板 -->
    <div id="tabMain" class="tab-content">
      <!-- 状态栏 -->
      <div class="status-bar">
        <span id="domainStatus" class="status-tag">检测中...</span>
        <span id="pageTitle" class="page-title"></span>
      </div>

      <!-- 按钮区 -->
      <div class="btn-row">
        <button id="extractBtn" class="btn btn-primary" disabled>📄 读取页面</button>
        <button id="cameraBtn" class="btn btn-accent" disabled>📷 拍照识图</button>
      </div>
      <div class="btn-row">
        <button id="voiceBtn" class="btn btn-voice" disabled>🎤 语音输入</button>
        <button id="analyzeBtn" class="btn btn-accent" disabled>🤖 AI 生成</button>
      </div>
      <div class="btn-row">
        <button id="autoBtn" class="btn btn-primary" disabled>⚡ 一键执行</button>
        <button id="fillBtn" class="btn btn-secondary" disabled>📝 填入页面</button>
      </div>

      <!-- 进度条 -->
      <div id="progressBar" class="progress-bar hidden">
        <div class="progress-fill"></div>
      </div>

      <!-- 内容预览 -->
      <div class="section">
        <div class="section-header">
          <span>📄 页面内容</span>
          <span id="contentCount" class="count"></span>
        </div>
        <textarea id="contentPreview" class="content-area" placeholder="点击"读取页面"或"拍照识图"获取内容..."></textarea>
      </div>

      <!-- 生成结果 -->
      <div class="section">
        <div class="section-header">
          <span>🤖 生成结果</span>
          <span id="resultCount" class="count"></span>
        </div>
        <textarea id="resultPreview" class="content-area result-area" placeholder="点击"AI 生成"获取结果..."></textarea>
      </div>
    </div>

    <!-- 备忘录面板 -->
    <div id="tabMemo" class="tab-content hidden">
      <div class="memo-actions">
        <button id="newMemoBtn" class="btn btn-primary btn-sm">+ 新建</button>
        <span id="memoCount" class="count"></span>
      </div>
      <div id="memoList" class="memo-list">
        <p class="empty-hint">暂无备忘录</p>
      </div>
    </div>

    <!-- 备忘录编辑覆盖层 -->
    <div id="memoEditor" class="overlay hidden">
      <div class="overlay-content memo-editor-content">
        <div class="overlay-header">
          <button id="memoBackBtn" class="icon-btn">←</button>
          <h2 id="memoEditorTitle">新建备忘录</h2>
          <button id="memoSaveBtn" class="btn btn-primary btn-sm">保存</button>
        </div>
        <div class="memo-editor-body">
          <input type="text" id="memoTitleInput" class="memo-title-input" placeholder="标题">
          <div class="memo-color-row" id="memoColorRow">
            <span class="color-dot default active" data-color="default"></span>
            <span class="color-dot red" data-color="red"></span>
            <span class="color-dot orange" data-color="orange"></span>
            <span class="color-dot blue" data-color="blue"></span>
            <span class="color-dot green" data-color="green"></span>
            <span class="color-dot purple" data-color="purple"></span>
          </div>
          <textarea id="memoContentInput" class="memo-content-input" rows="8" placeholder="输入内容...&#10;&#10;💡 提示：可将 AI 生成结果粘贴到这里保存"></textarea>
        </div>
      </div>
    </div>

    <!-- 历史面板 -->
    <div id="tabHistory" class="tab-content hidden">
      <div class="history-actions">
        <button id="clearHistory" class="btn btn-secondary btn-sm">清空历史</button>
      </div>
      <div id="historyList" class="history-list">
        <p class="empty-hint">暂无历史记录</p>
      </div>
    </div>
  </div>

  <!-- 设置面板 (覆盖层) -->
  <div id="settingsOverlay" class="overlay hidden">
    <div class="overlay-content">
      <div class="overlay-header">
        <h2>设置</h2>
        <button id="closeSettings" class="icon-btn">✕</button>
      </div>
      <div class="settings-body">
        <div class="form-group">
          <label for="apiKey">DeepSeek API Key</label>
          <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
        </div>
        <div class="form-group">
          <label for="baseUrl">API Base URL</label>
          <input type="text" id="baseUrl" placeholder="https://api.deepseek.com/v1/chat/completions">
        </div>
        <div class="form-group">
          <label for="model">文本模型</label>
          <select id="model">
            <option value="deepseek-v4-pro">deepseek-v4-pro</option>
            <option value="deepseek-chat">deepseek-chat (V3)</option>
            <option value="deepseek-reasoner">deepseek-reasoner (R1)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="visionModel">视觉模型 <span class="hint">(拍照OCR用)</span></label>
          <select id="visionModel">
            <option value="gpt-4o">gpt-4o</option>
            <option value="gpt-4o-mini">gpt-4o-mini</option>
            <option value="gpt-4.1">gpt-4.1</option>
          </select>
        </div>
        <div class="form-group">
          <label for="targetDomains">目标域名 <span class="hint">(每行一个，留空匹配全部)</span></label>
          <textarea id="targetDomains" rows="2" placeholder="*.example.com"></textarea>
        </div>
        <div class="form-group">
          <label for="speechLang">语音识别语言</label>
          <select id="speechLang">
            <option value="zh-CN">中文 (普通话)</option>
            <option value="en-US">English (US)</option>
            <option value="yue-Hant-HK">粤语</option>
          </select>
        </div>
        <div class="form-group">
          <label for="systemPrompt">系统提示词</label>
          <textarea id="systemPrompt" rows="2" placeholder="你是一个专业的文本分析助手..."></textarea>
        </div>
        <div class="form-group">
          <label for="userPrompt">用户提示词模板 <span class="hint">({{title}} / {{content}})</span></label>
          <textarea id="userPrompt" rows="3" placeholder="请分析以下网页内容..."></textarea>
        </div>
        <div class="form-actions">
          <button id="saveSettings" class="btn btn-primary">保存设置</button>
          <button id="resetSettings" class="btn btn-secondary">恢复默认</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
